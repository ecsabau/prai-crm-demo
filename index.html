<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRAI CRM Demo</title>
  <link rel="stylesheet" href="styles.css">
  <script src="pipeline.js" defer></script>
</head>
<body>
  <header><strong>PRAI</strong><span>Portfolio demo</span></header>
  <main>
    <section class="intro" aria-labelledby="title">
      <div>
        <h1 id="title">Sales pipeline</h1>
        <p>Move fictional leads through the pipeline. Refreshing the page restores the sample data.</p>
      </div>
      <button type="button" id="reset">Reset demo</button>
    </section>
    <dl class="metrics">
      <div><dt>Open leads</dt><dd id="open-count">0</dd></div>
      <div><dt>Open pipeline value</dt><dd id="open-value">£0</dd></div>
      <div><dt>Won value</dt><dd id="won-value">£0</dd></div>
    </dl>
    <p id="feedback" role="status"></p>
    <section class="board" id="board" aria-label="Sales stages"></section>
  </main>
</body>
</html>
